<div class="card-body p-2">
    <div class="container-fulid mt-1">
        <div class="card p-4 shadow">

            <div class="card">
                <img class="product-thumb" [src]="product.imageUrl" [alt]="product.name">
                <h3>{{ product.name }}</h3>
                <p>Price: {{ product.price | currency:'USD' }}</p>
            </div>

        </div>
    </div>
</div>
