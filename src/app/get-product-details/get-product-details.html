<div class="card table-card">
    <div class="card-header">
        <h5>Product Details Grid</h5>
    </div>
    <div class="card-body p-2">
        <div class="container-fulid mt-1">
            <div class="card p-4 shadow">

                <div *ngIf="isBrowser" style="width: 500;height: 500px;">
                    <ag-grid-angular style="width: 100%; height: 100%;"
                        class="ag-theme-quartz custom-ag-grid ag-cell-value" 
                        [rowData]="rowData" 
                        [columnDefs]="colDefs"
                        [pagination]="true" 
                        [paginationPageSize]="10" 
                        [paginationPageSizeSelector]="false" 
                        [animateRows]="true"
                        >
                    </ag-grid-angular>
                </div>

                <!-- Loading state or empty data state -->
                <div *ngIf="!isBrowser || (isLoading && rowData.length === 0)">
                    <p>Loading products or preparing grid...</p>
                </div>

            </div>
        </div>
    </div>
</div>
