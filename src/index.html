  <script>
    // safe caller for functions that may be defined by pcoded.js
    function callIfExists(fnName, ...args) {
      try {
        const fn = window[fnName];
        if (typeof fn === 'function') fn(...args);
      } catch (e) {
        console.warn(fnName + ' invocation failed', e);
      }
    }

    window.addEventListener('load', () => {
      try {
        // defensive placeholders to avoid pcoded.js touching missing elements
        const ensureId = (id) => {
          if (!document.getElementById(id)) {
            const el = document.createElement('div');
            el.id = id;
            el.style.display = 'none';
            document.body.appendChild(el);
          }
        };
        ensureId('pcoded-loader');
        ensureId('pcoded-overlay');

        const s = document.createElement('script');
        s.src = 'assets/js/pcoded.js';
        s.defer = false;
        s.onload = () => {
          console.debug('pcoded.js loaded');
          // ensure sidebar uses dark layout after pcoded.js initializes
          callIfExists('layout_sidebar_change', 'dark');
          // optional: call other safe initializers if you need them
          // callIfExists('layout_change', 'light');
          // callIfExists('preset_change', 'preset-1');
        };
        s.onerror = (e) => console.warn('pcoded.js failed to load', e);
        document.body.appendChild(s);
      } catch (e) {
        console.warn('Failed to load pcoded.js safely', e);
      }
    });
  </script>
