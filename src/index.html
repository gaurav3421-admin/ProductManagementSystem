  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const callIfExists = (fnName, ...args) => {
        if (typeof window[fnName] === 'function') {
          try { window[fnName](...args); } catch (e) { console.warn(`${fnName} failed:`, e); }
        } else {
          console.debug(`${fnName} not available`);
        }
      };

      callIfExists('layout_change', 'light');
      callIfExists('layout_sidebar_change', 'dark');
      callIfExists('change_box_container', 'false');
      callIfExists('layout_caption_change', 'true');
      callIfExists('layout_rtl_change', 'false');
      callIfExists('preset_change', 'preset-1');
    });
  </script>
